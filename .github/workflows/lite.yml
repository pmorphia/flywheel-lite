name: Flywheel Lite
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flywheel-lite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Flywheel Lite builds against a Flywheel checkout (stdlib + conformance suite), cloned
      # inside it as in local development.
      - uses: actions/checkout@v4
        with:
          repository: fwlang/flywheel
      - uses: actions/checkout@v4
        with:
          path: flywheel-lite
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build (make)
        if: runner.os != 'Windows'
        working-directory: flywheel-lite
        run: make
      - name: Build (CMake, MSVC)
        if: runner.os == 'Windows'
        working-directory: flywheel-lite
        run: |
          cmake -S . -B build
          cmake --build build --config Release
          copy build\Release\flywheel-lite.exe build\flywheel-lite.exe
      - name: Test
        working-directory: flywheel-lite
        run: python tests/run_tests.py build/flywheel-lite
      - name: GC stress
        if: runner.os != 'Windows'
        working-directory: flywheel-lite
        env:
          LITE_GC_STRESS: "1"
        run: python tests/run_tests.py build/flywheel-lite --only conformance
