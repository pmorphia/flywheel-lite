name: Release
# Builds prebuilt Flywheel Lite executables and publishes them as a GitHub release, so the
# installers (flywheel.polymorphia.dev/lite-install.sh and lite-install.ps1) can download them
# instead of needing a C compiler.
#
#   git tag v2.14-beta-14 && git push origin v2.14-beta-14
#
# or run it from the Actions tab with a tag name. Pushing a branch named release-check builds and
# tests everything without publishing. Tags containing "alpha" are marked as
# pre-releases, which the installers skip (they download releases/latest); beta and gamma
# tags are normal releases.
#
# Assets (the installers rely on these names):
#   flywheel-lite-linux-x86_64.tar.gz    glibc 2.28 or newer; loads native C/C++ imports
#   flywheel-lite-linux-aarch64.tar.gz   the same
#   flywheel-lite-linux-x86_64-musl.tar.gz    static, any distribution, without native imports
#   flywheel-lite-linux-aarch64-musl.tar.gz   the same
#   flywheel-lite-macos-universal.tar.gz Apple silicon and Intel, macOS 11+
#   flywheel-lite-windows-x86_64.zip     static C runtime, no redistributable needed
#   SHA256SUMS
on:
  push:
    tags: ["v*"]
    branches: [release-check]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (created on the selected branch if it does not exist)"
        required: true
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-latest
          - target: linux-aarch64
            os: ubuntu-24.04-arm
          - target: linux-x86_64-musl
            os: ubuntu-latest
          - target: linux-aarch64-musl
            os: ubuntu-24.04-arm
          - target: macos-universal
            os: macos-latest
          - target: windows-x86_64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      # Flywheel Lite embeds library modules from a Flywheel checkout, cloned inside it as in
      # local development (see lite.yml).
      - uses: actions/checkout@v4
        with:
          repository: fwlang/flywheel
      - uses: actions/checkout@v4
        with:
          path: flywheel-lite
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # An old glibc, so the executable runs on older distributions too; dynamic, because native
      # imports load shared libraries.
      - name: Build (Linux, glibc 2.28)
        if: runner.os == 'Linux' && !endsWith(matrix.target, '-musl')
        run: |
          docker run --rm -v "$PWD:/work" -w /work/flywheel-lite \
            "quay.io/pypa/manylinux_2_28_$(uname -m)" make
          sudo chown -R "$(id -u):$(id -g)" flywheel-lite/build
          file flywheel-lite/build/flywheel-lite
      - name: Build (Linux, static musl)
        if: runner.os == 'Linux' && endsWith(matrix.target, '-musl')
        working-directory: flywheel-lite
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          make CC="musl-gcc -static"
          file build/flywheel-lite
      - name: Build (macOS, universal)
        if: runner.os == 'macOS'
        working-directory: flywheel-lite
        run: |
          make CC="clang -arch arm64 -arch x86_64 -mmacosx-version-min=11.0"
          lipo -info build/flywheel-lite
      - name: Build (Windows, MSVC)
        if: runner.os == 'Windows'
        working-directory: flywheel-lite
        run: |
          cmake -S . -B build -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build build --config Release
          copy build\Release\flywheel-lite.exe build\flywheel-lite.exe

      - name: Native imports load
        if: runner.os == 'macOS' || (runner.os == 'Linux' && !endsWith(matrix.target, '-musl'))
        working-directory: flywheel-lite
        run: ./build/flywheel-lite tests/cases/native_imports.fw | diff - tests/cases/native_imports.out
      - name: Test
        working-directory: flywheel-lite
        run: python tests/run_tests.py build/flywheel-lite -v

      - name: Package (Linux, macOS)
        if: runner.os != 'Windows'
        working-directory: flywheel-lite/build
        run: |
          ./flywheel-lite --version
          tar -czf "flywheel-lite-${{ matrix.target }}.tar.gz" flywheel-lite
      - name: Package (Windows)
        if: runner.os == 'Windows'
        working-directory: flywheel-lite/build
        run: |
          .\flywheel-lite.exe --version
          Compress-Archive -Path flywheel-lite.exe -DestinationPath "flywheel-lite-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: flywheel-lite-${{ matrix.target }}
          path: |
            flywheel-lite/build/flywheel-lite-${{ matrix.target }}.tar.gz
            flywheel-lite/build/flywheel-lite-${{ matrix.target }}.zip
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum flywheel-lite-* > SHA256SUMS
          cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *alpha*) prerelease="--prerelease" ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Flywheel Lite $TAG" \
              --generate-notes $prerelease
          fi
