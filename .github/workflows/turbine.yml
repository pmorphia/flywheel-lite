name: Turbine
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  turbine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Turbine builds against a Flywheel checkout (stdlib + conformance suite), cloned
      # inside it as in local development.
      - uses: actions/checkout@v4
        with:
          repository: fwlang/flywheel
      - uses: actions/checkout@v4
        with:
          path: turbine
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build (make)
        if: runner.os != 'Windows'
        working-directory: turbine
        run: make
      - name: Build (CMake, MSVC)
        if: runner.os == 'Windows'
        working-directory: turbine
        run: |
          cmake -S . -B build
          cmake --build build --config Release
          copy build\Release\turbine.exe build\turbine.exe
      - name: Test
        working-directory: turbine
        run: python tests/run_tests.py build/turbine
      - name: GC stress
        if: runner.os != 'Windows'
        working-directory: turbine
        env:
          TURBINE_GC_STRESS: "1"
        run: python tests/run_tests.py build/turbine --only conformance
